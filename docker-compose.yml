services:
  invoice-ocr:
    # Container names will be invoice-ocr-1, invoice-ocr-2, etc.
    build: .
    image: aqiliman24/invoice-extractor:latest
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HOST=0.0.0.0
    deploy:
      mode: replicated
      replicas: ${INSTANCE_COUNT:-2} 
      resources:
        limits:
          cpus: '0.4'
          memory: 448M
        reservations:
          cpus: '0.3'
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 120s
    ports:
      - "5050-5051:5050"
    networks:
      - invoice-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


networks:
  invoice-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
