events {
    worker_connections 1024;
}

http {
    upstream invoice_backend {
        least_conn;  # Use least connections algorithm for better load distribution
        server localhost:5050;
        server localhost:5051;
        server localhost:5052;
        server localhost:5053;
    }

    server {
        listen 80;
        
        location / {
            proxy_pass http://invoice_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Timeouts for long-running requests
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            
            # Enable WebSocket support if needed
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Buffer settings for large requests
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
